*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
aside{width:270px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px;gap:8px;flex-shrink:0;transition:transform .2s}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;padding:6px 8px}
.logo{width:32px;height:32px;border-radius:50%;object-fit:cover;display:block;flex-shrink:0;background:#7fb4ee}.ver{font-size:11px;font-weight:600;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:0 7px;line-height:18px}
.newbtn{background:var(--grad);color:#fff;border:0;border-radius:10px;padding:10px;font-weight:600}
#list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.item{display:flex;align-items:center;border-radius:8px;padding:8px 10px;cursor:pointer;gap:6px}
.item:hover,.item.on{background:var(--hover)}
.item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.item button{background:none;border:0;color:var(--dim);opacity:0;padding:0 4px;font-size:16px}
.item:hover button{opacity:1}
.sidefoot{display:flex;gap:8px}
.sidefoot button{flex:1;background:none;border:1px solid var(--line);border-radius:8px;padding:7px;font-size:13px;color:var(--dim)}
.sidefoot button:hover{background:var(--hover)}
main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
.top{display:none;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.top button{background:none;border:0;font-size:22px;line-height:1}
#log{flex:1;overflow-y:auto;padding:24px 16px}
.col{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.m.user{align-self:flex-end;background:var(--user);padding:10px 16px;border-radius:18px 18px 4px 18px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}
.m.bot{display:flex;gap:12px;align-items:flex-start}
.m.bot .logo{width:30px;height:30px;margin-top:2px}
.body{flex:1;min-width:0;overflow-wrap:anywhere}
.body>*:first-child{margin-top:0}.body>*:last-child{margin-bottom:0}
.body p{margin:0 0 .8em}
.body h1,.body h2,.body h3{margin:1em 0 .4em;line-height:1.3}
.body h1{font-size:1.4em}.body h2{font-size:1.2em}.body h3{font-size:1.05em}
.body ul,.body ol{margin:0 0 .8em;padding-left:1.4em}
.body blockquote{margin:0 0 .8em;padding-left:12px;border-left:3px solid var(--line);color:var(--dim)}
.body a{color:var(--accent)}
.body code{background:var(--code);padding:2px 6px;border-radius:5px;font:.88em ui-monospace,Menlo,Consolas,monospace}
.cb{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:0 0 .8em;background:var(--code)}
.cbh{display:flex;justify-content:space-between;align-items:center;padding:4px 10px;font-size:12px;color:var(--dim);border-bottom:1px solid var(--line)}
.cbh button{background:none;border:0;color:var(--dim);font-size:12px}
.cb pre{margin:0;padding:12px;overflow-x:auto}
.cb code{background:none;padding:0;font-size:13px}
.acts{display:flex;gap:4px;margin-top:6px}
.acts button{background:none;border:0;color:var(--dim);font-size:13px;padding:4px 8px;border-radius:6px}
.acts button:hover{background:var(--hover);color:var(--text)}
.typing::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-left:4px;animation:p 1s infinite}
@keyframes p{50%{opacity:.2}}
.err{color:#e5484d}
.welcome{margin:8vh auto 0;text-align:center}
.welcome .logo{width:120px;height:120px;margin:0 auto 14px;box-shadow:0 8px 30px #35c9e655}
.welcome h1{margin:0 0 6px;font-size:28px}
.welcome p{color:var(--dim);margin:0 0 24px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left}
.cards button{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;text-align:left}
.cards button:hover{border-color:var(--accent)}
.cards b{display:block;font-size:13px;color:var(--accent);margin-bottom:2px}
.comp{padding:8px 16px 14px}
.box{max-width:760px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:24px;padding:8px 8px 8px 18px;box-shadow:0 2px 12px #0000000d}
.box:focus-within{border-color:var(--accent)}
textarea{flex:1;border:0;outline:0;resize:none;background:none;color:var(--text);font:inherit;max-height:160px;padding:6px 0}
#send{width:36px;height:36px;border-radius:50%;border:0;background:var(--grad);color:#fff;display:grid;place-items:center;flex-shrink:0}
#send:disabled{opacity:.35}
.hint{text-align:center;font-size:12px;color:var(--dim);margin-top:8px}
.scrim{display:none}
@media (max-width:760px){
aside{position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-100%);padding-top:calc(12px + env(safe-area-inset-top,0px))}
aside.open{transform:none}
.scrim.show{display:block;position:fixed;inset:0;background:#0006;z-index:10}
.top{display:flex}
.cards{grid-template-columns:1fr}
.welcome{margin-top:3vh}
}
